add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# This app runs inside a Shellui shell on another origin, so X-Frame-Options
# is not set. Allowed parents come from FRAME_ANCESTORS at container start.
include /etc/nginx/snippets/frame-ancestors.conf;
# frame-ancestors is its own header, written at container start. Browsers apply
# every Content-Security-Policy header.
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
